# JDK 25 needs a little more metaspace than 17 did for the same Compose/KSP workload.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# AGP 9 defaults: built-in Kotlin (android.builtInKotlin) and the new DSL
# (android.newDsl) are both ON and are NOT opted out of here. Do not add
# android.builtInKotlin=false / android.newDsl=false — they stop working in AGP 10
# and would re-introduce the deprecated variant API this project no longer uses.
