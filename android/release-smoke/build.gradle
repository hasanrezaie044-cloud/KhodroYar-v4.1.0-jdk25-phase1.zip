// Disposable CI test instrument. This is not an application/feature delivered to users.
plugins {
    id 'com.android.test'
}

android {
    namespace 'com.khodroyar.app.releasesmoke'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        minSdk 29
        targetSdk 35
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    targetProjectPath = ':app'
    // Run UIAutomator in this test APK, NOT inside the R8 target. Its runtime
    // dependencies are independent; no keep rules or debug flags in :app.
    experimentalProperties['android.experimental.self-instrumenting'] = true

    signingConfigs {
        release {
            def values = ['ANDROID_KEYSTORE_PATH', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD']
                .collect { System.getenv(it) }
            if (!values.any { it == null || it.trim().isEmpty() }) {
                storeFile file(values[0])
                storePassword values[1]
                keyAlias values[2]
                keyPassword values[3]
            }
        }
    }
    buildTypes {
        release {
            // Only the disposable test process. The tested :app release remains
            // non-debuggable, resource-shrunk and R8-optimised with its original key.
            debuggable true
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_25
        targetCompatibility JavaVersion.VERSION_25
        coreLibraryDesugaringEnabled true
    }
}

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

dependencies {
    // No project(:app) or Compose test runtime: accessibility-only black-box tests.
    implementation 'androidx.test.ext:junit:1.2.1'
    implementation 'androidx.test:runner:1.6.2'
    implementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
