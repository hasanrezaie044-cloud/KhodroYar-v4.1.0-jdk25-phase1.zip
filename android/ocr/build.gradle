plugins {
    id 'com.android.application'
}

def releaseVersion = new Properties()
rootProject.file('version.properties').withInputStream { releaseVersion.load(it) }

android {
    namespace 'com.khodroyar.ocr'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig {
        applicationId 'com.khodroyar.ocr'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        minSdk 24
        targetSdk 35
        versionName releaseVersion.getProperty('versionName')
        versionCode releaseVersion.getProperty('versionCode').toInteger()
    }
    signingConfigs {
        release {
            def path = System.getenv('ANDROID_KEYSTORE_PATH')
            if (path) {
                storeFile file(path)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_25
        targetCompatibility JavaVersion.VERSION_25
    }
}

dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'cz.adaptech.tesseract4android:tesseract4android:4.9.0'
}
