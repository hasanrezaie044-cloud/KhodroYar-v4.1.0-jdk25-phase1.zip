distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# Gradle 9.4.1 is the first line that both (a) runs on and compiles for JDK 25
# (Java 25 daemon support landed in 9.1.0) and (b) embeds Kotlin 2.3.0, which is what
# removes the "Kotlin does not yet support 25 JDK target, falling back to JVM_24"
# fallback that 9.1-9.3 still emit. It is also the minimum Gradle for AGP 9.2.
distributionUrl=https\://services.gradle.org/distributions/gradle-9.4.1-bin.zip
# distributionSha256Sum intentionally omitted: it must be pasted from
# https://gradle.org/release-checksums/ . A stale/incorrect value hard-fails the build.
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
