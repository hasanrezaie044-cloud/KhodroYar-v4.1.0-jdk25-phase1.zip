name: KhodroYar Native UI Smoke

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
      prepared_model:
        description: 'Calling release workflow already produced this run’s ALBERT artifact'
        required: false
        type: boolean
        default: false

concurrency:
  group: khodroyar-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-model:
    if: ${{ inputs.prepared_model != true }}
    permissions:
      contents: read
    uses: ./.github/workflows/offline-albert.yml
    with:
      ref: ${{ inputs.ref || github.sha }}

  ui-smoke:
    name: Compose UI · API 35 emulator
    needs: prepare-model
    if: ${{ !cancelled() && (needs.prepare-model.result == 'success' || inputs.prepared_model == true) }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools ndk;28.2.13676358 cmake;3.22.1'
      - name: Read verified offline ALBERT assets from this run
        uses: actions/download-artifact@v4
        with:
          name: khodroyar-offline-albert
          path: android/.cache/offline-assets
      - name: Verify model artifact and prepare pinned native SentencePiece source
        run: |
          python3 tools/offline-albert/verify_assets.py
          python3 tools/offline-albert/prepare_sentencepiece.py
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
          cache-read-only: true
      - name: Ensure wrapper
        working-directory: android
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 9.4.1 --distribution-type bin
          fi
          chmod +x gradlew
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compile UI tests before starting emulator
        working-directory: android
        run: |
          set +e
          ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace 2>&1 | tee "$RUNNER_TEMP/khodroyar-ui-compile.log"
          RESULT=${PIPESTATUS[0]}
          set -e
          python3 ../tools/annotate-build-errors.py "$RUNNER_TEMP/khodroyar-ui-compile.log"
          test "$RESULT" -eq 0
      - name: Run native UI tests on disposable emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash tools/run-ui-smoke.sh
      - name: Publish bounded synthetic previews for visual review
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          python3 -m venv "$RUNNER_TEMP/ui-preview-env"
          "$RUNNER_TEMP/ui-preview-env/bin/pip" --disable-pip-version-check -q install Pillow==12.0.0
      - name: Home preview
        if: always() && github.event_name == 'workflow_dispatch'
        run: '"$RUNNER_TEMP/ui-preview-env/bin/python" tools/ui-previews.py "$RUNNER_TEMP/orbit-ui-screenshots" 01-home-light-fa'
      - name: Annual statistics preview
        if: always() && github.event_name == 'workflow_dispatch'
        run: '"$RUNNER_TEMP/ui-preview-env/bin/python" tools/ui-previews.py "$RUNNER_TEMP/orbit-ui-screenshots" 21-reports-annual-statistics'
      - name: Home line chart preview
        if: always() && github.event_name == 'workflow_dispatch'
        run: '"$RUNNER_TEMP/ui-preview-env/bin/python" tools/ui-previews.py "$RUNNER_TEMP/orbit-ui-screenshots" 20-home-line-timeline-right'
      - name: Bar chart preview
        if: always() && github.event_name == 'workflow_dispatch'
        run: '"$RUNNER_TEMP/ui-preview-env/bin/python" tools/ui-previews.py "$RUNNER_TEMP/orbit-ui-screenshots" 18-dashboard-bars'
      - name: Compact layout preview
        if: always() && github.event_name == 'workflow_dispatch'
        run: '"$RUNNER_TEMP/ui-preview-env/bin/python" tools/ui-previews.py "$RUNNER_TEMP/orbit-ui-screenshots" 19-home-dark-320-large-text'
      - name: Recent services preview
        if: always() && github.event_name == 'workflow_dispatch'
        run: '"$RUNNER_TEMP/ui-preview-env/bin/python" tools/ui-previews.py "$RUNNER_TEMP/orbit-ui-screenshots" 22-reports-recent-services'
      - name: Compact report table preview
        if: always() && github.event_name == 'workflow_dispatch'
        run: '"$RUNNER_TEMP/ui-preview-env/bin/python" tools/ui-previews.py "$RUNNER_TEMP/orbit-ui-screenshots" 23-report-table-320-large-text'
      - name: Upload native screenshots and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: khodroyar-orbit-native-ui
          path: |
            ${{ runner.temp }}/orbit-ui-screenshots
            android/app/build/reports/androidTests/connected
            android/app/build/outputs/androidTest-results/connected
          if-no-files-found: warn
          retention-days: 14

  feature-previews:
    name: Feature screen visual review
    needs: ui-smoke
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Read this run's native screenshots
        uses: actions/download-artifact@v4
        with:
          name: khodroyar-orbit-native-ui
          path: ${{ runner.temp }}/native-feature-review
      - name: Set up bounded preview encoder
        run: |
          python3 -m venv "$RUNNER_TEMP/feature-preview-env"
          "$RUNNER_TEMP/feature-preview-env/bin/pip" --disable-pip-version-check -q install Pillow==12.0.0
      - name: Compact quick entry
        run: '"$RUNNER_TEMP/feature-preview-env/bin/python" tools/ui-previews.py "$RUNNER_TEMP/native-feature-review" 25-quick-entry-320-large-text'
      - name: Reviewed quick entry
        run: '"$RUNNER_TEMP/feature-preview-env/bin/python" tools/ui-previews.py "$RUNNER_TEMP/native-feature-review" 26-quick-entry-review'
      - name: Fuel review in dark mode
        run: '"$RUNNER_TEMP/feature-preview-env/bin/python" tools/ui-previews.py "$RUNNER_TEMP/native-feature-review" 28-quick-fuel-dark-review'
      - name: Maintenance forecast
        run: '"$RUNNER_TEMP/feature-preview-env/bin/python" tools/ui-previews.py "$RUNNER_TEMP/native-feature-review" 29-maintenance-forecast'
      - name: Financial comparison
        run: '"$RUNNER_TEMP/feature-preview-env/bin/python" tools/ui-previews.py "$RUNNER_TEMP/native-feature-review" 31-financial-comparison'
      - name: Automation health
        run: '"$RUNNER_TEMP/feature-preview-env/bin/python" tools/ui-previews.py "$RUNNER_TEMP/native-feature-review" 32-automation-health'
      - name: Quick edit failure diagnostics
        if: always()
        run: '"$RUNNER_TEMP/feature-preview-env/bin/python" tools/ui-previews.py "$RUNNER_TEMP/native-feature-review" debug-quick-edit-state'

  offline-feature-previews:
    name: ALBERT and Bazaar native visual review
    needs: ui-smoke
    if: always() && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: khodroyar-orbit-native-ui
          path: ${{ runner.temp }}/offline-feature-review
      - name: Set up bounded native preview encoder
        run: |
          python3 -m venv "$RUNNER_TEMP/offline-preview-env"
          "$RUNNER_TEMP/offline-preview-env/bin/pip" --disable-pip-version-check -q install Pillow==12.0.0
      - name: Dismissible Bazaar warning in compact Persian layout
        run: '"$RUNNER_TEMP/offline-preview-env/bin/python" tools/ui-previews.py "$RUNNER_TEMP/offline-feature-review" 34-bazaar-update-rtl-320'
      - name: Manual Bazaar check and listing link
        run: '"$RUNNER_TEMP/offline-preview-env/bin/python" tools/ui-previews.py "$RUNNER_TEMP/offline-feature-review" 35-bazaar-update-settings'
      - name: Bazaar not installed is not an update warning
        run: '"$RUNNER_TEMP/offline-preview-env/bin/python" tools/ui-previews.py "$RUNNER_TEMP/offline-feature-review" 36-bazaar-not-installed'
      - name: Actual offline ALBERT request awaiting approval
        run: '"$RUNNER_TEMP/offline-preview-env/bin/python" tools/ui-previews.py "$RUNNER_TEMP/offline-feature-review" 37-offline-albert-approval'
      - name: Reported night-service conversation with a fresh corrected approval
        run: '"$RUNNER_TEMP/offline-preview-env/bin/python" tools/ui-previews.py "$RUNNER_TEMP/offline-feature-review" 38-night-service-correction'
