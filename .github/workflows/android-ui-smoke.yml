name: KhodroYar Native UI Smoke

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: khodroyar-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-smoke:
    name: Compose UI · API 35 emulator
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
          cache-read-only: true
      - name: Ensure wrapper
        working-directory: android
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 9.4.1 --distribution-type bin
          fi
          chmod +x gradlew
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compile UI tests before starting emulator
        working-directory: android
        run: |
          set +e
          ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace 2>&1 | tee "$RUNNER_TEMP/khodroyar-ui-compile.log"
          RESULT=${PIPESTATUS[0]}
          set -e
          python3 ../tools/annotate-build-errors.py "$RUNNER_TEMP/khodroyar-ui-compile.log"
          test "$RESULT" -eq 0
      - name: Run native UI tests on disposable emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash tools/run-ui-smoke.sh
      - name: Upload native screenshots and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: khodroyar-orbit-native-ui
          path: |
            ${{ runner.temp }}/orbit-ui-screenshots
            android/app/build/reports/androidTests/connected
            android/app/build/outputs/androidTest-results/connected
          if-no-files-found: warn
          retention-days: 14
