name: Build and publish APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    name: Build APK and publish download
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-36 build-tools;36.0.0 platform-tools'

      - name: Build signed release APK when signing secrets exist; otherwise build debug APK
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          gradle_log="$RUNNER_TEMP/gradle-build.log"
          run_gradle() {
            local result=0
            ./gradlew "$@" --no-daemon --stacktrace >"$gradle_log" 2>&1 || result=$?
            cat "$gradle_log"
            if [[ "$result" -ne 0 ]]; then
              python3 - "$gradle_log" <<'PY'
          import pathlib, sys
          lines = pathlib.Path(sys.argv[1]).read_text(errors="replace").splitlines()
          markers = [line for line in lines if "e: " in line or "error:" in line.lower() or "FAILURE:" in line]
          excerpt = "\n".join((markers[-35:] if markers else lines[-80:]))[-8000:]
          excerpt = excerpt.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A").replace(":", "%3A").replace(",", "%2C")
          print(f"::error title=Gradle build failed::{excerpt}")
          PY
              return "$result"
            fi
          }
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            signing_dir="$RUNNER_TEMP/khodroyar-signing"
            mkdir -p "$signing_dir"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$signing_dir/release.jks"
            test -s "$signing_dir/release.jks"
            export ANDROID_KEYSTORE_PATH="$signing_dir/release.jks"
            export ANDROID_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
            export ANDROID_KEY_ALIAS="$KEY_ALIAS"
            export ANDROID_KEY_PASSWORD="$KEY_PASSWORD"
            run_gradle :app:assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/app-release.apk"
            APK_KIND=signed-release
            echo "APK_KIND=$APK_KIND" >> "$GITHUB_ENV"
          else
            run_gradle :app:assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/app-release.apk"
            APK_KIND=debug
            echo "APK_KIND=$APK_KIND" >> "$GITHUB_ENV"
          fi
          test -s "$RUNNER_TEMP/app-release.apk"
          sha256sum "$RUNNER_TEMP/app-release.apk" | tee "$RUNNER_TEMP/app-release.apk.sha256"
          printf 'Built %s APK: %s bytes\n' "$APK_KIND" "$(stat -c %s "$RUNNER_TEMP/app-release.apk")"

      - name: Upload Gradle diagnostics on build failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: gradle-build-log
          path: ${{ runner.temp }}/gradle-build.log
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-release-apk
          path: |
            ${{ runner.temp }}/app-release.apk
            ${{ runner.temp }}/app-release.apk.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: app-build-${{ github.run_id }}-${{ github.run_attempt }}
          name: KhodroYar APK build ${{ github.run_number }} (${{ github.ref_name }})
          prerelease: true
          generate_release_notes: true
          files: |
            ${{ runner.temp }}/app-release.apk
            ${{ runner.temp }}/app-release.apk.sha256
          body: |
            Automated ${{ env.APK_KIND }} APK built from commit `${{ github.sha }}` on `${{ github.ref_name }}`.

            Download `app-release.apk` below. If it is a debug build, it is signed with Android's debug key and is not suitable for upgrading an already-installed production-signed app.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
