name: LiteRT-LM AAR size probe (temporary)
on:
  push:
    branches: [arena/c66aaad2-khodroyar-v4-1-0-jdk25-phase1]
    paths: ['.github/workflows/litertlm-size-probe.yml']
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -e
          V=0.19.1
          B=https://dl.google.com/android/maven2/com/google/ai/edge/litertlm/litertlm-android/$V
          curl -fsSL $B/litertlm-android-$V.aar -o l.aar
          mkdir x && cd x && unzip -q ../l.aar
          S="aar=$(stat -c %s ../l.aar);"
          for f in $(find . -type f \( -name '*.so' -o -name '*.jar' \) | sort); do S="$S $f=$(stat -c %s $f)/gz$(gzip -9c $f | wc -c);"; done
          echo "::notice title=aar-files::$S"
          DEPS=$(curl -fsSL $B/litertlm-android-$V.pom | tr -d ' \n' | grep -o '<dependency>[^/]*<artifactId>[^<]*</artifactId><version>[^<]*' | sed 's/<[^>]*>/ /g' | tr -s ' ' | tr '\n' ';')
          echo "::notice title=pom-deps::$DEPS"
          META=$(curl -fsSL https://dl.google.com/android/maven2/com/google/ai/edge/litertlm/litertlm-android/maven-metadata.xml | tr -d ' \n')
          echo "::notice title=versions::$META"
