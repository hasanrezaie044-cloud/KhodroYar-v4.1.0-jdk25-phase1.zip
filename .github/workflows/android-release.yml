name: KhodroYar Android APK Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: 'Verify native UI, or build the signed release; public delivery requires publish_apk'
        type: choice
        options: [release, ui-only, diagnostics]
        default: release
      publish_apk:
        description: 'Owner explicitly authorises a public signed APK artifact and GitHub Release after all tests pass'
        required: false
        type: boolean
        default: false
      evidence_run_id:
        description: 'Existing run ID for diagnostics-only: synthetic emulator crash evidence, never APKs'
        required: false
        type: string
      delivery_upload_url:
        description: 'Ciphertext receiver URL (public, NEVER the user download URL)'
        required: false
        type: string
      delivery_public_key:
        description: 'Public RSA PEM for end-to-end encrypted private APK delivery'
        required: false
        type: string
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to build'
        required: false
        type: string
      publish_apk:
        description: 'Explicit owner permission to publish the verified signed APK'
        required: false
        type: boolean
        default: false
      delivery_upload_url:
        required: false
        type: string
      delivery_public_key:
        required: false
        type: string
    secrets:
      KEYSTORE_BASE64:
        required: true
      KEYSTORE_PASSWORD:
        required: true
      KEY_ALIAS:
        required: true
      KEY_PASSWORD:
        required: true
    outputs:
      version-name:
        value: ${{ jobs.release.outputs.version-name }}

concurrency:
  # A UI-only check must not cancel a signed APK's runtime/delivery verification.
  group: khodroyar-release-${{ github.ref }}-${{ inputs.mode || 'release' }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '25'
  ANDROID_COMPILE_SDK: '36'
  ANDROID_BUILD_TOOLS: '36.0.0'

jobs:
  release:
    if: ${{ inputs.mode != 'ui-only' && inputs.mode != 'diagnostics' }}
    name: Signed APK Release (JDK 25)
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      # Private delivery stays the default. An explicit publish_apk=true permits
      # a public candidate artifact; the final Release waits for BOTH test jobs.
      contents: write
    outputs:
      version-name: ${{ steps.version.outputs.version_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Check private receiver HTTPS before building
        if: ${{ !inputs.publish_apk && inputs.delivery_upload_url != '' }}
        env:
          DELIVERY: ${{ inputs.delivery_upload_url }}
        run: |
          python3 - <<'PY'
          import os, urllib.parse, urllib.request
          url = urllib.parse.urlsplit(os.environ['DELIVERY'])
          assert url.scheme == 'https' and url.hostname and not url.username and not url.password and not url.query and not url.fragment
          root = urllib.parse.urlunsplit((url.scheme, url.netloc, '/', '', ''))
          with urllib.request.urlopen(urllib.request.Request(root, method='HEAD'), timeout=30) as response:
              assert response.status == 200
          print('::notice title=Private receiver HTTPS::Reachable with a valid HTTPS connection; no APK published and no owner capability sent to CI.')
          PY

      - name: Check encrypted Git-object handoff permission
        if: ${{ !inputs.publish_apk && inputs.delivery_upload_url == '' && inputs.delivery_public_key != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, secrets, subprocess
          data = secrets.token_bytes(32)
          payload = json.dumps(dict(encoding='base64', content=base64.b64encode(data).decode())).encode()
          reply = json.loads(subprocess.check_output(['gh', 'api', '--method', 'POST', 'repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/blobs', '--input', '-'], input=payload))
          assert reply['sha'] == hashlib.sha1(b'blob 32\0' + data).hexdigest()
          print('::notice title=Encrypted handoff transport::Write permission verified using random opaque bytes. No APK, ref, branch, tag or Release was published.')
          PY

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-${{ env.ANDROID_COMPILE_SDK }} build-tools;${{ env.ANDROID_BUILD_TOOLS }} platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Ensure Gradle wrapper jar exists
        working-directory: android
        run: |
          # gradle-wrapper.jar is a binary that was missing from the 5.1.8 source archive.
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 9.4.1 --distribution-type bin
          fi
          test -f gradle/wrapper/gradle-wrapper.jar

      - name: Validate JDK 25
        run: |
          java -version 2>&1 | grep -Eq "openjdk.*25|java.*25" || { echo "JDK 25 required"; exit 1; }

      - name: Validate signing secrets
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          KP: ${{ secrets.KEYSTORE_PASSWORD }}
          KA: ${{ secrets.KEY_ALIAS }}
          KPW: ${{ secrets.KEY_PASSWORD }}
        run: |
          [[ -n "$KS" ]] || { echo "KEYSTORE_BASE64 missing"; exit 1; }
          [[ -n "$KP" ]] || { echo "KEYSTORE_PASSWORD missing"; exit 1; }
          [[ -n "$KA" ]] || { echo "KEY_ALIAS missing"; exit 1; }
          [[ -n "$KPW" ]] || { echo "KEY_PASSWORD missing"; exit 1; }

      - name: Decode keystore
        id: keystore
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          KEYSTORE_DIR="${RUNNER_TEMP}/khodroyar-signing"
          mkdir -p "$KEYSTORE_DIR"
          printf '%s' "$KS" | base64 --decode > "$KEYSTORE_DIR/release.jks"
          test -s "$KEYSTORE_DIR/release.jks"
          echo "path=$KEYSTORE_DIR/release.jks" >> "$GITHUB_OUTPUT"



      - name: Test AI backend (mock provider, no API key)
        working-directory: backend
        run: npm test

      - name: Static checks and unit tests
        working-directory: android
        run: |
          chmod +x ./gradlew
          STATIC_ONLY=1 bash ../tools/check-permissions.sh
          python3 ../tools/verify-ocr-assets.py
          set +e
          ./gradlew :app:testDebugUnitTest --stacktrace 2>&1 | tee "$RUNNER_TEMP/khodroyar-tests.log"
          TEST_EXIT=${PIPESTATUS[0]}
          set -e
          python3 ../tools/annotate-build-errors.py "$RUNNER_TEMP/khodroyar-tests.log"
          python3 ../tools/summarize-tests.py app/build/test-results/testDebugUnitTest
          test "$TEST_EXIT" -eq 0

      - name: Upload Android unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: khodroyar-unit-tests
          path: android/app/build/test-results/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 14

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          set +e
          ./gradlew clean :app:assembleRelease :release-smoke:assembleRelease --stacktrace 2>&1 | tee "$RUNNER_TEMP/khodroyar-release.log"
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e
          python3 ../tools/annotate-build-errors.py "$RUNNER_TEMP/khodroyar-release.log"
          test "$BUILD_EXIT" -eq 0
          test -f "app/build/outputs/apk/release/app-release.apk"
          test -s "app/build/outputs/apk/release/app-release.apk"

      - name: Enforce total APK size below 100 MB
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          BYTES=$(stat -c %s "$APK")
          test "$BYTES" -lt 100000000 || { echo "APK exceeds the 100 MB product budget"; exit 1; }
          echo "::notice title=Signed APK size::$BYTES bytes; limit 100000000 bytes"

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep "versionName" android/app/build.gradle | head -1 | sed -E "s/.*versionName '([^']+)'.*/\1/")
          CODE=$(grep "versionCode" android/app/build.gradle | head -1 | awk '{print $2}')
          test -n "$VERSION"
          [[ "$CODE" =~ ^[0-9]+$ ]]
          echo "version_name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          SHA=$(sha256sum "$APK" | awk '{print $1}')
          echo "::notice title=Signed APK SHA256::$SHA"
          CERT=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "${#CERT}" -eq 64
          echo "::notice title=APK signing certificate SHA256::$CERT"
          if "$APKSIGNER" verify "$APK" 2>&1 | grep -qi "DOES NOT VERIFY"; then
            echo "APK signature verification failed"
            exit 1
          fi
          if "$APKSIGNER" verify --print-certs "$APK" | grep -qi "CN=Android Debug"; then
            echo "APK is signed with debug certificate"
            exit 1
          fi

      - name: Audit permissions (merged APK)
        run: bash tools/check-permissions.sh android/app/build/outputs/apk/release

      - name: Verify version
        run: |
          AAPT="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/aapt2"
          "$AAPT" dump badging android/app/build/outputs/apk/release/app-release.apk | grep -F "versionCode='${{ steps.version.outputs.version_code }}' versionName='${{ steps.version.outputs.version_name }}'" || exit 1

      - name: Verify package name
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAPT="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/aapt2"
          "$AAPT" dump badging "$APK" | grep -E "^package: name='com\.khodroyar\.app'" || exit 1

      - name: Audit bundled offline OCR and native library alignment
        run: |
          python3 tools/audit-ocr-apk.py android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/verification.json
          "$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/zipalign" -c -P 16 -v 4 android/app/build/outputs/apk/release/app-release.apk
          AAPT="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/aapt2"
          if "$AAPT" dump badging android/app/build/outputs/apk/release/app-release.apk | grep -q "application-debuggable"; then
            echo "Release APK is debuggable"; exit 1
          fi
          CERT=$("$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$CERT" = "03bfbc3575667403c3259fae345f3eb1ad3045373cb62123be376ef4898caaf0" || { echo "Signing identity changed"; exit 1; }
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          path = Path('android/app/build/outputs/apk/release/verification.json')
          proof = json.loads(path.read_text())
          proof.update(package='com.khodroyar.app', version_name='${{ steps.version.outputs.version_name }}',
              version_code=int('${{ steps.version.outputs.version_code }}'), head_sha=subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              certificate_sha256='03bfbc3575667403c3259fae345f3eb1ad3045373cb62123be376ef4898caaf0',
              debuggable=False, zipalign_16kb='passed', room_version=6,
              baseline='797d7061c5f669cf4fa3e7361c0b3c2dca10490c')
          path.write_text(json.dumps(proof, indent=2) + '\n')
          PY

      - name: Check strict instrumentation protocol parser (fixtures only)
        run: python3 tools/test-instrumentation-summary.py

      - name: Check explicit public-delivery guards (fixtures only)
        run: python3 tools/test-public-apk-release.py

      - name: Enable KVM for actual signed release verification
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Verify real OCR in the signed non-debuggable R8 APK
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          ram-size: 3072M
          heap-size: 512M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash tools/run-release-smoke.sh

      - name: Upload signed-release runtime test evidence (not the APK)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: khodroyar-signed-release-test-evidence
          path: |
            android/app/build/outputs/androidTest-results/connected
            ${{ runner.temp }}/khodroyar-release-smoke
          if-no-files-found: ignore
          retention-days: 14

      - name: Prepare originally signed APK for owner-authorised public delivery
        if: ${{ inputs.publish_apk }}
        run: |
          python3 tools/public-apk-release.py prepare android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/verification.json "$RUNNER_TEMP/public-apk" --head "$GITHUB_SHA"

      - name: Upload owner-authorised signed APK candidate
        if: ${{ inputs.publish_apk }}
        uses: actions/upload-artifact@v4
        with:
          name: khodroyar-signed-release-candidate
          path: ${{ runner.temp }}/public-apk/
          if-no-files-found: error
          retention-days: 14

      - name: End-to-end encrypted private delivery (no additional repository secret)
        if: ${{ !inputs.publish_apk }}
        env:
          KHODROYAR_ENCRYPTED_APK_UPLOAD_URL: ${{ inputs.delivery_upload_url }}
          KHODROYAR_DELIVERY_PUBLIC_KEY: ${{ inputs.delivery_public_key }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m pip install --disable-pip-version-check --target "$RUNNER_TEMP/khodroyar-delivery-deps" 'cryptography==46.0.3'
          PYTHONPATH="$RUNNER_TEMP/khodroyar-delivery-deps" python3 tools/test-private-delivery.py
          PYTHONPATH="$RUNNER_TEMP/khodroyar-delivery-deps" python3 tools/send-private-apk.py android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/release/verification.json

      - name: Upload R8 mapping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: khodroyar-r8-mapping
          path: android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
          retention-days: 30

  ui-smoke:
    if: ${{ inputs.mode != 'diagnostics' }}
    name: Native UI smoke and screenshots
    permissions:
      contents: read
    uses: ./.github/workflows/android-ui-smoke.yml
    with:
      ref: ${{ inputs.ref || github.sha }}

  public-release:
    name: Publish verified signed APK and test actual public HTTPS download
    needs: [release, ui-smoke]
    if: ${{ inputs.publish_apk && needs.release.result == 'success' && needs.ui-smoke.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout exact verified source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Read this run's signed and runtime-verified candidate
        uses: actions/download-artifact@v4
        with:
          name: khodroyar-signed-release-candidate
          path: ${{ runner.temp }}/public-apk
      - name: Publish only after signed runtime and all native UI tests pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/public-apk-release.py publish "$RUNNER_TEMP/public-apk" --head "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID"

  diagnostics:
    name: Read synthetic emulator crash evidence
    if: ${{ inputs.mode == 'diagnostics' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Validate the existing run identifier
        env:
          RUN_ID: ${{ inputs.evidence_run_id }}
        run: '[[ "$RUN_ID" =~ ^[0-9]{1,20}$ ]]'
      - name: Read only synthetic test evidence, not an APK
        uses: actions/download-artifact@v4
        with:
          name: khodroyar-signed-release-test-evidence
          run-id: ${{ inputs.evidence_run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/signed-test-diagnostics
      - name: Expose bounded emulator crash diagnostics through checks
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'signed-test-diagnostics'
          for path in sorted(root.rglob('logcat.txt')):
              lines = path.read_text(errors='replace').splitlines()
              needles = ('khodroyar', 'androidruntime', 'androidjunitrunner', 'testrunner',
                  'fatal', 'noclassdeffound', 'nosuchmethod', 'linker', 'exception', 'instrumentation')
              starts = [i for i, line in enumerate(lines) if any(word in line.lower() for word in needles)]
              selected = set()
              for start in starts:
                  selected.update(range(max(0, start-12), min(len(lines), start+28)))
              text = '\n'.join(lines[i] for i in sorted(selected))[:28000] if selected else '\n'.join(lines[:180])[:28000]
              for index in range(0, len(text), 3500):
                  piece = text[index:index+3500].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::notice title=Synthetic signed-runtime crash {index//3500+1}::' + piece)
          PY
