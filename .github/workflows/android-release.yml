name: KhodroYar Android APK Release

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build
        required: false
        type: string
    secrets:
      KEYSTORE_BASE64:
        required: true
      KEYSTORE_PASSWORD:
        required: true
      KEY_ALIAS:
        required: true
      KEY_PASSWORD:
        required: true
    outputs:
      version-name:
        value: ${{ jobs.release.outputs.version-name }}

concurrency:
  group: khodroyar-release-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '25'
  ANDROID_COMPILE_SDK: '36'
  ANDROID_BUILD_TOOLS: '36.0.0'

jobs:
  release:
    name: Signed APK Release (JDK 25)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version-name: ${{ steps.version.outputs.version_name }}
    steps:
      - name: Checkout current ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-${{ env.ANDROID_COMPILE_SDK }} build-tools;${{ env.ANDROID_BUILD_TOOLS }} platform-tools'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Validate original signing secrets
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
          KP: ${{ secrets.KEYSTORE_PASSWORD }}
          KA: ${{ secrets.KEY_ALIAS }}
          KPW: ${{ secrets.KEY_PASSWORD }}
        run: |
          [[ -n "$KS" && -n "$KP" && -n "$KA" && -n "$KPW" ]] || { echo 'Original release signing configuration missing; no replacement key will be generated.'; exit 1; }
      - name: Decode original keystore outside checkout
        id: keystore
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          DIR="${RUNNER_TEMP}/khodroyar-signing"
          mkdir -p "$DIR"
          printf '%s' "$KS" | base64 --decode > "$DIR/release.jks"
          test -s "$DIR/release.jks"
          echo "path=$DIR/release.jks" >> "$GITHUB_OUTPUT"
      - name: Read actual resulting version
        id: version
        run: |
          python3 tools/version.py
          echo "version_name=$(sed -n 's/^versionName=//p' android/version.properties)" >> "$GITHUB_OUTPUT"
      - name: Static checks, permission audit, credential scan
        run: |
          git diff --check
          STATIC_ONLY=1 bash tools/check-permissions.sh
          python3 -m unittest discover -s tools -p 'test_*.py' -v
          python3 tools/check-secrets.py --history
          cd backend && npm test
      - name: Compile Kotlin, KSP, Compose and run JVM unit tests
        run: CI_CHECK_NAME=tests bash tools/ci-gradle.sh :app:testDebugUnitTest :app:compileDebugKotlin :ocr:compileDebugKotlin
      - name: Preserve unit test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: khodroyar-unit-tests-${{ steps.version.outputs.version_name }}
          path: |
            android/app/build/reports/tests
            android/app/build/test-results
            .verification/*.log
          if-no-files-found: ignore
      - name: Build signed main and optional OCR APKs (R8)
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: CI_CHECK_NAME=release bash tools/ci-gradle.sh :app:assembleRelease :ocr:assembleRelease
      - name: Read actual pre-ALBERT baseline APK
        uses: actions/download-artifact@v4
        with:
          name: khodroyar-release-signed-5.4.0
          path: .verification/baselines/pre-albert
          github-token: ${{ github.token }}
          run-id: 43016583464
      - name: Read actual latest ALBERT baseline APK
        uses: actions/download-artifact@v4
        with:
          name: khodroyar-release-signed-5.5.1
          path: .verification/baselines/albert
          github-token: ${{ github.token }}
          run-id: 43084276600
      - name: Build unmodified provided source as size reference
        id: original
        continue-on-error: true
        env:
          ANDROID_KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ORIGINAL="$RUNNER_TEMP/khodroyar-original"
          mkdir -p "$ORIGINAL"
          git archive 9b66596ce07f3b42eb8451d853c61ca735bdd27a android | tar -x -C "$ORIGINAL"
          cd "$ORIGINAL/android"
          gradle :app:assembleRelease --stacktrace > "$GITHUB_WORKSPACE/.verification/original-build.log" 2>&1
          mkdir -p "$GITHUB_WORKSPACE/.verification/baselines/provided-source"
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/.verification/baselines/provided-source/"
      - name: Verify package, version, signatures, size and embedded credentials
        run: |
          bash tools/check-permissions.sh
          BASELINES=()
          while IFS= read -r -d '' file; do BASELINES+=(--baseline "$file"); done < <(find .verification/baselines -name '*.apk' -print0)
          python3 tools/verify-release.py --apk android/app/build/outputs/apk/release/app-release.apk --ocr android/ocr/build/outputs/apk/release/ocr-release.apk "${BASELINES[@]}"
          python3 tools/check-secrets.py --apk android/app/build/outputs/apk/release/app-release.apk --apk android/ocr/build/outputs/apk/release/ocr-release.apk
      - name: Android lint (record existing and new diagnostics)
        id: lint
        continue-on-error: true
        run: CI_CHECK_NAME=lint bash tools/ci-gradle.sh :app:lintDebug :ocr:lintDebug
      - name: Publish signed APKs and verification evidence
        uses: actions/upload-artifact@v4
        with:
          name: khodroyar-release-signed-${{ steps.version.outputs.version_name }}
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            android/ocr/build/outputs/apk/release/ocr-release.apk
            .verification/release-verification.json
            .verification/original-build.log
            android/app/build/reports/lint-results-debug.*
            android/ocr/build/reports/lint-results-debug.*
          if-no-files-found: error
          retention-days: 30
      - name: Publish R8 mapping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: khodroyar-r8-mapping-${{ steps.version.outputs.version_name }}
          path: |
            android/app/build/outputs/mapping/release/mapping.txt
            android/ocr/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore
      - name: Release summary
        if: always()
        run: |
          echo '### Actual verification results' >> "$GITHUB_STEP_SUMMARY"
          echo 'Provided-source build: ${{ steps.original.outcome }}; lint: ${{ steps.lint.outcome }}' >> "$GITHUB_STEP_SUMMARY"
          if [ -f .verification/release-verification.json ]; then cat .verification/release-verification.json >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Remove temporary signing file
        if: always()
        run: rm -f '${{ steps.keystore.outputs.path }}'

  native-offline-verification:
    name: Native Persian OCR and document import (API 35)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'
          cache-read-only: true
      - name: Verify official optional Persian data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/fetch-persian-ocr-data.py --output android/ocr/src/androidTest/assets/fas.traineddata
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compile native instrumentation tests
        run: CI_CHECK_NAME=native-compile bash tools/ci-gradle.sh :app:assembleDebugAndroidTest :ocr:assembleDebugAndroidTest
      - name: Run genuinely local OCR and PDF/image import on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: CI_CHECK_NAME=native-tests bash tools/ci-gradle.sh :app:connectedDebugAndroidTest :ocr:connectedDebugAndroidTest
      - name: Publish native results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: khodroyar-native-offline-verification
          path: |
            android/app/build/outputs/androidTest-results
            android/ocr/build/outputs/androidTest-results
            android/app/build/reports/androidTests
            android/ocr/build/reports/androidTests
            android/ocr/src/androidTest/assets/fas.traineddata
            .verification/*.log
          if-no-files-found: ignore
